# ====================================================================
# Apache Virtual Host Configuration for Campusly StudentHub Portal
# System: Campusly Academic Management Portal (CSPIT, CHARUSAT)
# Domain: http://studenthub.local
# Document Root: /Users/jaynavadiya07/Desktop/Project
# ====================================================================

# 1. macOS / Linux Apache Virtual Host Definition
<VirtualHost *:80>
    ServerAdmin admin@studenthub.local
    ServerName studenthub.local
    ServerAlias www.studenthub.local

    DocumentRoot "/Users/jaynavadiya07/Desktop/Project"

    <Directory "/Users/jaynavadiya07/Desktop/Project">
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted

        # Priority Directory Index
        DirectoryIndex index.php index.html

        # URL Rewrite Engine for RESTful API and Clean Routing
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>

        # Security Headers
        <IfModule mod_headers.c>
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-XSS-Protection "1; mode=block"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
        </IfModule>
    </Directory>

    # Custom Error Documents
    ErrorDocument 403 /dashboard.php
    ErrorDocument 404 /index.php

    # Access and Error Logs
    ErrorLog "/private/var/log/apache2/studenthub_error.log"
    CustomLog "/private/var/log/apache2/studenthub_access.log" combined
</VirtualHost>

